[workspace]
members = ["crates/ecad-domain", "crates/ecad-app", "crates/ecad-adapters", "crates/ecad-bridge", "xtask"]
exclude = ["apps/desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
ecad-domain = { path = "crates/ecad-domain" }
ecad-app = { path = "crates/ecad-app" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
getrandom = "0.4.3"
uuid = { version = "1.29.0", default-features = false }
sha2 = "0.10.9"
base64 = "0.22.1"
png = "0.18.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
