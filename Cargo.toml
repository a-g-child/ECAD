[workspace]
members = ["crates/ecad-domain", "crates/ecad-app", "crates/ecad-adapters", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
ecad-domain = { path = "crates/ecad-domain" }
ecad-app = { path = "crates/ecad-app" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
